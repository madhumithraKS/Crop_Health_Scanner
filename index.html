<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAEAWRX - Smart Early Crop Health Detection</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; text-align: center; }
        .status-box { display: flex; justify-content: space-around; margin-top: 30px; }
        .card { background: #e8f5e9; padding: 20px; border-radius: 8px; width: 40%; text-align: center; border-left: 5px solid #4caf50; }
        .card h3 { margin: 0 0 10px; color: #1b5e20; }
        .footer { text-align: center; margin-top: 40px; color: #777; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SAEAWRX Dashboard</h1>
        <p style="text-align: center; font-size: 18px;">Smart Early Crop Health Detection and Risk Monitoring System</p>
        
        <div class="status-box">
            <div class="card">
                <h3>Crop Health Status</h3>
                <p style="font-size: 22px; color: #2e7d32; font-weight: bold;">Healthy (94%)</p>
            </div>
            <div class="card">
                <h3>Risk Monitoring</h3>
                <p style="font-size: 22px; color: #d32f2f; font-weight: bold;">Low Risk Detected</p>
            </div>
        </div>

        <div class="footer">
            <p>SIH 2026 Project Deployment | Live & Active</p>
        </div>
    </div>
</body>
</html>
